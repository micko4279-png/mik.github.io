<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Midnight Studio Drum Machine</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="drum-machine">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>

      <div class="main-container">
        <header>
          <div class="header-text">
            <h1>Midnight Studio</h1>
            <p class="subtitle">Pro Series • Dark Edition</p>
          </div>
          <div class="status-badge" aria-label="Connection status">
            <div class="status-dot"></div>
            <span id="status-text">Connected</span>
          </div>
        </header>

        <div class="interface-grid" aria-label="Drum machine controls">
          <!-- Left: Drum pads -->
          <div class="pad-container" id="pad-container" aria-label="Drum pads">
            <div id="pad-bank" class="pad-grid">
              <button class="drum-pad" id="heater-1" type="button" value="Q">
                Q
                <audio
                  class="clip"
                  id="Q"
                  src="https://s3.amazonaws.com/freecodecamp/drums/Heater-1.mp3"
                ></audio>
              </button>
              <button class="drum-pad" id="heater-2" type="button" value="W">
                W
                <audio
                  class="clip"
                  id="W"
                  src="https://s3.amazonaws.com/freecodecamp/drums/Heater-2.mp3"
                ></audio>
              </button>
              <button class="drum-pad" id="heater-3" type="button" value="E">
                E
                <audio
                  class="clip"
                  id="E"
                  src="https://s3.amazonaws.com/freecodecamp/drums/Heater-3.mp3"
                ></audio>
              </button>
              <button class="drum-pad" id="heater-4" type="button" value="A">
                A
                <audio
                  class="clip"
                  id="A"
                  src="https://s3.amazonaws.com/freecodecamp/drums/Heater-4_1.mp3"
                ></audio>
              </button>
              <button class="drum-pad" id="clap" type="button" value="S">
                S
                <audio
                  class="clip"
                  id="S"
                  src="https://s3.amazonaws.com/freecodecamp/drums/Heater-6.mp3"
                ></audio>
              </button>
              <button class="drum-pad" id="open-hh" type="button" value="D">
                D
                <audio
                  class="clip"
                  id="D"
                  src="https://s3.amazonaws.com/freecodecamp/drums/Dsc_Oh.mp3"
                ></audio>
              </button>
              <button class="drum-pad" id="kick-n-hat" type="button" value="Z">
                Z
                <audio
                  class="clip"
                  id="Z"
                  src="https://s3.amazonaws.com/freecodecamp/drums/Kick_n_Hat.mp3"
                ></audio>
              </button>
              <button class="drum-pad" id="kick" type="button" value="X">
                X
                <audio
                  class="clip"
                  id="X"
                  src="https://s3.amazonaws.com/freecodecamp/drums/RP4_KICK_1.mp3"
                ></audio>
              </button>
              <button class="drum-pad" id="closed-hh" type="button" value="C">
                C
                <audio
                  class="clip"
                  id="C"
                  src="https://s3.amazonaws.com/freecodecamp/drums/Cev_H2.mp3"
                ></audio>
              </button>
            </div>
          </div>

          <!-- Right: Controls -->
          <div class="controls-column">
            <div class="display-screen">
              <span class="display-label">Now Playing</span>
              <p id="display"></p>
            </div>

            <div class="control-row">
              <div class="panel">
                <div class="center">
                  <div class="panel-label">Power</div>
                  <div class="toggle-wrapper">
                    <label class="toggle-switch">
                      <input
                        type="checkbox"
                        id="power-switch"
                        checked
                        title="Power On"
                      />
                      <span class="slider-switch"></span>
                    </label>
                  </div>
                </div>

                <hr />

                <div>
                  <div class="panel-label">Bank</div>
                  <div
                    class="bank-selector"
                    role="radiogroup"
                    aria-label="Sound bank"
                  >
                    <button class="bank-btn active" id="bank-1" type="button">
                      Heater
                    </button>
                    <button class="bank-btn" id="bank-2" type="button">
                      Piano
                    </button>
                  </div>
                </div>
              </div>

              <div class="panel volume-panel" aria-label="Volume">
                <div class="panel-label volume-label">Volume</div>
                <div class="volume-wrapper">
                  <input
                    type="range"
                    min="0"
                    max="100"
                    value="50"
                    id="volume-slider"
                    aria-label="Master volume"
                  />
                </div>
                <span class="material-symbols-outlined">volume_up</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
